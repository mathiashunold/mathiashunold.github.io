<script>
(function(){
const P = JSON.parse(document.getElementById('payload').textContent);
const KEY = 'ansicht-pw';
const u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const msg = t => { document.getElementById('msg').textContent = t; };
function store(v){ try { v === null ? localStorage.removeItem(KEY) : localStorage.setItem(KEY, v); } catch(e){} }
function load(){ try { return localStorage.getItem(KEY); } catch(e){ return null; } }
async function open(pw){
  if (!window.crypto || !crypto.subtle) throw new Error('nocrypto');
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:u8(P.s), iterations:P.n, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const packed = await crypto.subtle.decrypt({name:'AES-GCM', iv:u8(P.i)}, key, u8(P.c));
  const stream = new Blob([packed]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return await new Response(stream).text();
}
function show(h){ document.open(); document.write(h); document.close(); }
async function tryOpen(pw, saved){
  document.getElementById('go').disabled = true; msg(saved ? '' : 'Wird geöffnet …');
  try { const h = await open(pw); store(pw); show(h); }
  catch(e){
    msg(e.message === 'nocrypto' ? 'Dieser Browser kann die Seite nicht entschlüsseln (bitte über https öffnen).' : (saved ? '' : 'Passwort falsch.'));
    document.getElementById('go').disabled = false;
  }
}
document.getElementById('f').addEventListener('submit', ev => { ev.preventDefault(); tryOpen(document.getElementById('pw').value, false); });
const saved = load(); if (saved) tryOpen(saved, true);
})();
</script></body></html>
