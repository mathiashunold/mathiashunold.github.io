<html lang="de">

<style>
:root{
  --bg:#E6EAEC; --surface:#FFFFFF; --surface-2:#F1F3F4; --ink:#1A2024; --muted:#5A656C;
  --line:#CBD2D6; --accent:#1C5FD1; --on-accent:#FFFFFF; --warn:#B8323A; --warn-bg:#FBE9EA;
  --ok:#1E7A46; --ok-bg:#E5F3EA; --shadow:0 6px 24px rgba(20,30,40,.10);
  --font:"Barlow Semi Condensed","Arial Narrow",system-ui,-apple-system,"Segoe UI",sans-serif; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13171A; --surface:#1D2226; --surface-2:#252B30; --ink:#E4E8EB; --muted:#97A2A9;
    --line:#343C42; --accent:#6AA2FF; --on-accent:#0A1830; --warn:#FF7378; --warn-bg:#3A1C1F;
    --ok:#6FD39A; --ok-bg:#16301F; --shadow:0 6px 24px rgba(0,0,0,.4); color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.4;min-height:100vh;
  padding:max(12px,env(safe-area-inset-top)) 12px max(24px,env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:860px;margin:0 auto}
body.breit main{max-width:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px;margin:0 0 12px}
.top{display:flex;align-items:center;gap:10px;margin:4px 0 14px;flex-wrap:wrap}
.top h1{flex:1;margin:0;font-size:24px;line-height:1.15;min-width:180px}
.top small{display:block;font-size:14px;font-weight:500;color:var(--muted)}
h2{font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);
  border-radius:10px;padding:8px 14px;font-size:16px;font-weight:600;min-height:44px;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.icon{width:44px;padding:0}
.btn.klein{min-height:36px;padding:4px 10px;font-size:15px}
.btn:disabled{opacity:.5}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
label{display:block;font-size:15px;font-weight:600;margin:10px 0 4px}
.field{width:100%;font-size:18px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);min-height:48px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid3{display:grid;grid-template-columns:2fr 2fr 1fr;gap:8px}
.hint{font-size:14px;color:var(--muted);margin:6px 0 0}
.status{font-size:14px;color:var(--muted);margin:8px 0}
.eintrag{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:12px;margin:0 0 8px;cursor:pointer;min-height:60px}
.eintrag .n{flex:1;min-width:0}.eintrag b{display:block;font-size:18px}.eintrag .s{font-size:14px;color:var(--muted)}
.vorlage{display:grid;grid-template-columns:160px minmax(0,1fr);gap:14px}
@media (max-width:560px){.vorlage{grid-template-columns:1fr}}
.vorlage img{width:100%;border-radius:8px;border:1px solid var(--line);background:#fff;aspect-ratio:4/3;object-fit:contain}
.blaetter{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.blaetter .btn{min-height:40px}
.blaetter .btn small{font-weight:500;color:inherit;opacity:.75}
.seiten{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.seiten button{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:6px;cursor:pointer;text-align:left;font-weight:600;font-size:15px}
.seiten button.fertig{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok)}
.seiten img{width:100%;display:block;background:#fff;border-radius:6px;margin-bottom:4px}
.seiten small{display:block;font-weight:500;color:var(--muted)}
.zuschnitt{position:relative;touch-action:none;user-select:none;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.zuschnitt canvas{display:block;width:100%;height:auto}
.zuschnitt .rahmen{position:absolute;border:2px dashed #D0021B;background:rgba(208,2,27,.06);pointer-events:none}
.werkzeuge{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 8px}
.werkzeuge .trenner{width:1px;align-self:stretch;background:var(--line);margin:0 4px}
.plan{position:relative;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.plan svg{display:block;width:100%;height:calc(100vh - 250px);min-height:380px;touch-action:none;cursor:crosshair}
.plan svg.pan{cursor:grab}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;align-items:start}
@media (max-width:1000px){.layout{grid-template-columns:1fr}.plan svg{height:62vh}}
.seite{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;max-height:calc(100vh - 160px);overflow:auto}
@media (max-width:1000px){.seite{max-height:none}}
table.masse{width:100%;border-collapse:collapse;font-size:16px}
table.masse th{font-size:13px;color:var(--muted);text-align:left;font-weight:600;padding:4px}
table.masse td{padding:3px 4px;border-top:1px solid var(--line);vertical-align:middle}
table.masse tr.aktiv td{background:var(--surface-2)}
table.masse .nr{font-size:13px;color:var(--muted)}
table.masse input{width:100%;min-width:70px;text-align:right;font-weight:700;font-size:19px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
table.masse input.text{text-align:left;font-weight:500;font-size:16px}
table.masse .soll,table.masse .diff{text-align:right;white-space:nowrap;font-size:15px;color:var(--muted)}
table.masse .diff.gross{color:var(--warn);font-weight:700}
.sync{font-size:14px;color:var(--muted)}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 12px;margin-top:8px;font-weight:600}
[hidden]{display:none !important}
.eingabe{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;width:min(680px,calc(100vw - 24px));
  background:var(--surface);border:2px solid var(--accent);border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.35);padding:12px}
.eingabe .kopf{display:flex;gap:10px;align-items:baseline}.eingabe .kopf b{flex:1;font-size:18px}.eingabe .kopf span{color:var(--muted);font-size:15px}
.eingabe .zeile{display:flex;gap:8px;margin-top:8px}.eingabe .zeile input{flex:1;font-size:28px;font-weight:700;text-align:right;padding:6px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);min-width:0}
.eingabe canvas{display:block;width:100%;margin-top:8px;background:#fff;border:1px dashed #999;border-radius:10px;touch-action:none;cursor:crosshair}
.eingabe .acts{margin-top:8px}.eingabe .acts .btn{flex:1}
.schiebeleiste{position:fixed;left:50%;top:max(10px,env(safe-area-inset-top));transform:translateX(-50%);z-index:41;display:flex;gap:10px;align-items:center;background:var(--surface);border:2px solid var(--accent);border-radius:14px;padding:6px 6px 6px 14px;box-shadow:0 6px 24px rgba(0,0,0,.3);font-size:15px}
.layout.ohneListe{grid-template-columns:1fr}.layout.ohneListe .plan svg{height:calc(100vh - 190px)}
.fotogross{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px}
.fotogross img{max-width:100%;max-height:calc(100% - 90px);object-fit:contain;border-radius:8px}.fotogross .acts{margin:0;justify-content:center}
.fotogross p{color:#fff;margin:0;font-weight:600}
.fotoleiste{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.fotoleiste button{padding:0;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;position:relative}
.fotoleiste img{width:84px;height:84px;object-fit:cover;border-radius:8px;display:block}.fotoleiste span{position:absolute;left:4px;top:4px;background:#1C5FD1;color:#fff;font-size:12px;font-weight:700;border-radius:6px;padding:0 5px}
</style>

<body>
<main id="app"></main>
<script src="lib/pdf.min.js"></script>
<script src="lib/pdf-lib.min.js"></script>
<script src="glm.js"></script>
<script>
// Planaufmass (Beta): Grundrisse (PDF/Bild) hochladen, am PC rote Masslinien ziehen, je Typ und Geschoss ein leeres Blatt;
// auf der Baustelle Masse am Tablet eintippen, mit Stift aufs Blatt schreiben oder vom Bosch übernehmen; Blätter leer oder ausgefüllt drucken.
// Speichern: localStorage + IndexedDB (Planbilder, auch offline), privates Repo Branch «kontrolle», Ordner planaufmass/.
(function(){
'use strict';
// ---------- Grundlagen ----------
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k, v){ try { localStorage.setItem(k, v); } catch(e){} } };
const jetzt = () => new Date().toISOString();
const zahl = s => { const v = parseFloat(String(s).replace(/[\s’']/g, '').replace(',', '.')); return isFinite(v) ? v : null; };
const mmTxt = v => v == null || v === '' || isNaN(v) ? '' : String(Math.round(v * 2) / 2).replace('.', ',');
// Eingabe mit Rechnung (Wunsch Mathias 26.11.): «2400+35-12» → v = 2423, f = «2400+35-12» (Rechnung bleibt zum Nachsehen gespeichert)
function rechne(s){
  const t = String(s == null ? '' : s).replace(/[\s’']/g, '').replace(/[−–]/g, '-').replace(/,/g, '.').replace(/[+-]+$/, '');
  if (!t) return {v: null, f: null};
  if (/[^0-9.+-]/.test(t)) return {v: zahl(s), f: null};
  const teile = t.match(/[+-]?[0-9]*\.?[0-9]+/g); if (!teile) return {v: null, f: null};
  const v = Math.round(teile.reduce((a, x) => a + parseFloat(x), 0) * 10) / 10;
  return /[0-9.][+-]/.test(t) ? {v, f: t.replace(/\./g, ',')} : {v: zahl(t), f: null};
}
const rechnungTxt = w => w && w.f ? w.f.replace(/-/g, ' − ').replace(/\+/g, ' + ') + ' = ' + mmTxt(w.v) : '';
const neueId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const ROT = '#D0021B', BLAU = '#1C5FD1', TOL = 10;   // mm: Abweichung Ist ↔ Plan, ab der die Differenz rot erscheint
const token = () => ls.get('upload-schluessel'), repo = () => ls.get('planung-repo');
const BETA = ls.get('beta') === '1';
const Q = new URLSearchParams(location.search);
const ORDNER = 'planaufmass';
let S = {ansicht: 'liste', nr: null, vid: null, bid: null, modus: 'linie', sel: null, aktiv: null, farbe: ROT, sync: '', imp: null, vb: {}};
let index = ladeLokal('planaufmass-index') || {v: 1, auftraege: []};
let daten = null;   // {v, auftrag:{nr,titel,zeit}, vorlagen:[], blaetter:[]}
function ladeLokal(k){ try { return JSON.parse(ls.get(k) || 'null'); } catch(e){ return null; } }
const aktiveVorlagen = () => (daten ? daten.vorlagen : []).filter(v => !v.weg);
const blaetterVon = vid => (daten ? daten.blaetter : []).filter(b => !b.weg && b.vorlage === vid);
const vorlage = id => daten && daten.vorlagen.find(v => v.id === id);
const blatt = id => daten && daten.blaetter.find(b => b.id === id);
// Masslinien eines Plans; mit Blatt zusätzlich die auf der Baustelle ergänzten Linien dieses Blatts (b.linien, nur dieses Geschoss)
// b.anp[lid] = Anpassung einer Plan-Linie nur für dieses Blatt (nach dem Aufmass am PC: weg = ausgeblendet, x1..ab = verschoben)
const linienVon = (v, b) => { const A = (b && b.anp) || {};
  const L = (v.linien || []).filter(l => !l.weg && !(A[l.id] && A[l.id].weg)).map(l => { const a = A[l.id]; return a && a.x1 != null ? Object.assign({}, l, {x1: a.x1, y1: a.y1, x2: a.x2, y2: a.y2, ab: a.ab}) : l; });
  const E = b ? (b.linien || []).filter(l => !l.weg) : [];
  L.forEach((l, i) => { l.nr = i + 1; }); E.forEach((l, i) => { l.nr = L.length + i + 1; }); return E.length ? L.concat(E) : L; };
const ausgeblendet = (v, b) => (v.linien || []).filter(l => !l.weg && b && b.anp && b.anp[l.id] && b.anp[l.id].weg);
const zusatzLinie = (b, lid) => !!(b && (b.linien || []).some(x => x.id === lid));

// ---------- GitHub (privates Repo, Branch «kontrolle») ----------
const API = 'https://api.github.com', BRANCH = 'kontrolle';
async function gh(method, p, body){
  const r = await fetch(API + p, {method, headers: Object.assign({'Authorization': 'Bearer ' + token(), 'Accept': 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28'}, body ? {'Content-Type': 'application/json'} : {}), body: body ? JSON.stringify(body) : undefined});
  if (r.status === 404) return null;
  if (!r.ok) { const e = new Error('GitHub ' + r.status); e.status = r.status; throw e; }
  return r.status === 204 ? {} : r.json();
}
const b64enc = s => btoa(unescape(encodeURIComponent(s))), b64dec = s => decodeURIComponent(escape(atob(s.replace(/\s/g, ''))));
const pfad = p => '/repos/' + repo() + '/contents/' + p.split('/').map(encodeURIComponent).join('/');
async function branchSicher(){
  if (await gh('GET', '/repos/' + repo() + '/git/ref/heads/' + BRANCH)) return;
  const main = await gh('GET', '/repos/' + repo() + '/git/ref/heads/main');
  await gh('POST', '/repos/' + repo() + '/git/refs', {ref: 'refs/heads/' + BRANCH, sha: main.object.sha});
}
async function holeJson(p){   // über raw, damit auch Dateien > 1 MB gehen
  const r = await fetch(API + pfad(p) + '?ref=' + BRANCH, {headers: {'Authorization': 'Bearer ' + token(), 'Accept': 'application/vnd.github.raw'}});
  if (r.status === 404) return {sha: null, d: null};
  if (!r.ok) { const e = new Error('GitHub ' + r.status); e.status = r.status; throw e; }
  const d = await r.json(), m = await gh('GET', pfad(p) + '?ref=' + BRANCH + '&_=' + Date.now()).catch(() => null);
  return {sha: m && m.sha, d};
}
async function schreibe(p, inhaltB64, sha, msg){ return gh('PUT', pfad(p), {message: msg, content: inhaltB64, branch: BRANCH, ...(sha ? {sha} : {})}); }
const online = () => !!(token() && repo() && navigator.onLine);

// ---------- Zusammenführen (mehrere Geräte): je Objekt gewinnt der neuere Zeitstempel, Masswerte und Striche einzeln ----------
const neuer = (x, y) => (!x ? y : !y ? x : ((x.zeit || '') >= (y.zeit || '') ? x : y));
function mischeIndex(a, b){
  const m = {}; for (const q of [a, b]) for (const x of (q && q.auftraege) || []) m[x.nr] = neuer(m[x.nr], x);
  return {v: 1, auftraege: Object.values(m).sort((x, y) => String(y.zeit).localeCompare(String(x.zeit)))};
}
function mischeBlatt(a, b){
  if (!a || !b) return a || b;
  const n = Object.assign({}, neuer(a, b)), werte = {};
  for (const q of [a, b]) for (const [k, w] of Object.entries(q.werte || {})) werte[k] = neuer(werte[k], w);
  const ink = {}; for (const q of [a, b]) for (const s of q.ink || []) ink[s.id] = neuer(ink[s.id], s);
  const fo = {}; for (const q of [a, b]) for (const f of q.fotos || []) fo[f.id] = neuer(fo[f.id], f);
  n.werte = werte; n.ink = Object.values(ink).sort((x, y) => (x.erstellt || '').localeCompare(y.erstellt || ''));
  n.fotos = Object.values(fo).sort((x, y) => (x.erstellt || '').localeCompare(y.erstellt || ''));
  const ha = {}; for (const q of [a, b]) for (const [k, h] of Object.entries(q.hand || {})) ha[k] = neuer(ha[k], h);
  n.hand = ha;
  const an = {}; for (const q of [a, b]) for (const [k, x] of Object.entries(q.anp || {})) an[k] = neuer(an[k], x);
  n.anp = an;
  const zl = {}; for (const q of [a, b]) for (const l of q.linien || []) zl[l.id] = neuer(zl[l.id], l);
  n.linien = Object.values(zl).sort((x, y) => (x.erstellt || '').localeCompare(y.erstellt || '')); return n;
}
function mischeDaten(a, b){
  if (!a) return b; if (!b) return a;
  const v = {}, bl = {};
  for (const q of [a, b]) for (const x of q.vorlagen || []) v[x.id] = neuer(v[x.id], x);
  for (const q of [a, b]) for (const x of q.blaetter || []) bl[x.id] = mischeBlatt(bl[x.id], x);
  const sort = o => Object.values(o).sort((x, y) => (x.erstellt || '').localeCompare(y.erstellt || ''));
  return {v: 1, auftrag: neuer(a.auftrag, b.auftrag), vorlagen: sort(v), blaetter: sort(bl)};
}
// Ergebnis des Zusammenführens IN die bestehenden Objekte übernehmen: offene Ansichten halten Verweise auf Vorlage/Blatt –
// würde «daten» ersetzt, schrieben sie nach dem ersten Hochladen in eine verwaiste Kopie (Fehler «Masse werden nicht gespeichert», 26.11.)
function datenUebernehmen(m){
  if (!daten || !m) { daten = m || daten; return; }
  const gleich = (alt, neu) => { const map = new Map((alt || []).map(x => [x.id, x]));
    return (neu || []).map(x => { const a = map.get(x.id); if (!a) return x; for (const k of Object.keys(a)) if (!(k in x)) delete a[k]; return Object.assign(a, x); }); };
  daten.vorlagen = gleich(daten.vorlagen, m.vorlagen); daten.blaetter = gleich(daten.blaetter, m.blaetter); Object.assign(daten.auftrag, m.auftrag);
}
let syncT = 0, laeuft = false;
function speichern(){
  if (daten) ls.set('planaufmass-' + daten.auftrag.nr, JSON.stringify(daten));
  ls.set('planaufmass-index', JSON.stringify(index));
  clearTimeout(syncT); syncT = setTimeout(hochladen, 2000);
}
function merkeIndex(){
  if (!daten) return; const a = daten.auftrag, i = index.auftraege.findIndex(x => x.nr === a.nr);
  const e = {nr: a.nr, titel: a.titel || '', vorlagen: aktiveVorlagen().length, blaetter: daten.blaetter.filter(b => !b.weg).length, fertig: daten.blaetter.filter(b => !b.weg && b.fertig).length, zeit: jetzt()};
  if (i >= 0) index.auftraege[i] = e; else index.auftraege.unshift(e);
}
async function hochladen(versuch){
  if (!token() || !repo()) { S.sync = 'Nur auf diesem Gerät gespeichert (kein Upload-Schlüssel – in der Übersicht einfügen).'; return zeigeSync(); }
  if (!navigator.onLine) { S.sync = 'Offline – auf dem Gerät gespeichert, wird später hochgeladen.'; return zeigeSync(); }
  if (laeuft) { clearTimeout(syncT); syncT = setTimeout(hochladen, 1500); return; }
  laeuft = true; S.sync = 'Speichere …'; zeigeSync();
  try {
    await branchSicher();
    await bilderHochladen();
    const fi = await holeJson(ORDNER + '/index.json'); index = mischeIndex(fi.d, index); ls.set('planaufmass-index', JSON.stringify(index));
    await schreibe(ORDNER + '/index.json', b64enc(JSON.stringify(index, null, 1)), fi.sha, 'Planaufmass: Auftragsliste');
    if (daten) {
      const p = ORDNER + '/' + daten.auftrag.nr + '.json', f = await holeJson(p);
      datenUebernehmen(mischeDaten(f.d, daten)); ls.set('planaufmass-' + daten.auftrag.nr, JSON.stringify(daten));
      await schreibe(p, b64enc(JSON.stringify(daten)), f.sha, 'Planaufmass ' + daten.auftrag.nr);
    }
    S.sync = 'Gespeichert für alle Geräte · ' + new Date().toLocaleTimeString('de-CH', {hour: '2-digit', minute: '2-digit'});
  } catch(e) {
    laeuft = false;
    if ((e.status === 409 || e.status === 422) && !versuch) return hochladen(1);
    S.sync = e.status === 401 ? 'Upload-Schlüssel ungültig – in der Übersicht neu einfügen. Auf dem Gerät gespeichert.'
           : 'Hochladen fehlgeschlagen (' + (e.status || e.message) + '). Auf dem Gerät gespeichert.';
  }
  laeuft = false; zeigeSync();
}
function zeigeSync(){ const el = $('#sync'); if (el) el.textContent = S.sync; }

// ---------- Planbilder: IndexedDB (bleiben im Gerät für die Baustelle), danach ins Repo ----------
let idb = null;
function db(){ return idb || (idb = new Promise((ok, err) => { const r = indexedDB.open('planaufmass', 1);
  r.onupgradeneeded = () => { r.result.createObjectStore('bilder'); r.result.createObjectStore('offen'); };
  r.onsuccess = () => ok(r.result); r.onerror = () => err(r.error); })); }
async function idbTx(store, mode, fn){ const d = await db(); return new Promise((ok, err) => { const t = d.transaction(store, mode); const r = fn(t.objectStore(store));
  t.oncomplete = () => ok(r && r.result); t.onerror = () => err(t.error); }); }
const bildSetzen = (k, v) => idbTx('bilder', 'readwrite', s => s.put(v, k)), bildHolen = k => idbTx('bilder', 'readonly', s => s.get(k));
const offenSetzen = k => idbTx('offen', 'readwrite', s => s.put(1, k)), offenWeg = k => idbTx('offen', 'readwrite', s => s.delete(k)),
      offenListe = () => idbTx('offen', 'readonly', s => s.getAllKeys());
const blobB64 = b => new Promise(ok => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.readAsDataURL(b); });
async function bilderHochladen(){
  for (const k of (await offenListe().catch(() => [])) || []) {
    const blob = await bildHolen(k); if (!blob) { await offenWeg(k); continue; }
    const da = await gh('GET', pfad(k) + '?ref=' + BRANCH);
    if (!da) await schreibe(k, await blobB64(blob), null, 'Planaufmass: Plan');
    await offenWeg(k);
  }
}
const bildUrls = {}, bildBlobs = {};
async function bildUrl(k){
  if (!k) return ''; if (bildUrls[k]) return bildUrls[k];
  let blob = await bildHolen(k).catch(() => null);
  if (!blob && online()) {
    const r = await fetch(API + pfad(k) + '?ref=' + BRANCH, {headers: {'Authorization': 'Bearer ' + token(), 'Accept': 'application/vnd.github.raw'}});
    if (r.ok) { blob = await r.blob(); bildSetzen(k, blob).catch(() => {}); }   // für die Baustelle im Gerät behalten
  }
  if (blob) bildBlobs[k] = blob;
  return blob ? (bildUrls[k] = URL.createObjectURL(blob)) : '';
}

// ---------- Massstab: mm in Wirklichkeit pro Bildpunkt ----------
function mmProPx(v){ return v.kalib || (v.ptProPx && v.massstab ? v.ptProPx * 25.4 / 72 * v.massstab : null); }
function laenge(l){ return Math.hypot(l.x2 - l.x1, l.y2 - l.y1); }
function soll(v, l){ if (l.soll != null && l.soll !== '') return +l.soll; if (l.art === 'h') return null; const f = mmProPx(v); return f ? Math.round(laenge(l) * f) : null; }
function nummeriere(v){ linienVon(v).forEach((l, i) => { l.nr = i + 1; }); }

// ---------- Plan zeichnen (SVG in Bildpunkten des Plans) – gemeinsam für Bearbeiten, Blatt und Druck ----------
// Geometrie einer Masslinie in Bildpunkten: Messpunkte P1/P2 bleiben, die Masslinie liegt um «ab» (entlang n) daneben, Hilfslinien verbinden beide
// Grösse von Kästchen und Zahlen (F, Bildpunkte): so gewählt, dass im A3-PDF jeder Plan gleich grosse Kästchen hat (9 pt × Faktor),
// Faktor gilt für den ganzen Auftrag (Wunsch Mathias 26.11.: «Boxen bei allen PDF einheitlich grösser oder kleiner»)
const A3B = 1190.55 - 44, A3H = 841.89 - 44 - 30;
const kastenFaktor = () => (daten && daten.auftrag && daten.auftrag.gr) || 1;
function fGr(v){ return 9 * kastenFaktor() / Math.min(A3B / v.w, A3H / v.h); }
const strichStil = () => !!(daten && daten.auftrag && daten.auftrag.stil === 'strich');   // Feld für die Zahl: Kästchen (Standard) oder Schreibstrich
function kastenAendern(f){ daten.auftrag.gr = Math.round(Math.min(2.5, Math.max(.5, kastenFaktor() * f)) * 100) / 100; daten.auftrag.zeit = jetzt(); speichern(); }
// Stiftdicke (Wunsch Mathias 26.11.): Notiz-Stift als Anteil von F, Schreibfeld als Anteil der Feldhöhe; gemerkt im Gerät
const DICKEN = {fein: {n: .06, h: .035, t: 'Fein'}, mittel: {n: .12, h: .055, t: 'Mittel'}, dick: {n: .22, h: .09, t: 'Dick'}};
const dicke = () => DICKEN[S.dicke || ls.get('planaufmass-dicke') || 'mittel'] || DICKEN.mittel;
const dickeKnoepfe = () => Object.entries(DICKEN).map(([k, d]) => `<button class="btn klein" type="button" data-dicke="${k}" aria-pressed="${dicke() === d}" aria-label="Stift ${d.t}">
  <svg width="26" height="14" aria-hidden="true"><line x1="3" y1="7" x2="23" y2="7" stroke="currentColor" stroke-width="${k === 'fein' ? 1.5 : k === 'mittel' ? 3.5 : 7}" stroke-linecap="round"/></svg>${d.t}</button>`).join('');
function dickeVerdrahten(nachher, wurzel){ (wurzel || document).querySelectorAll('[data-dicke]').forEach(k => k.onclick = () => { S.dicke = k.dataset.dicke; ls.set('planaufmass-dicke', S.dicke);
  document.querySelectorAll('[data-dicke]').forEach(x => x.setAttribute('aria-pressed', x.dataset.dicke === S.dicke)); if (nachher) nachher(); }); }
// Handschrift im Feld: Striche in 0..1 (bezogen auf das Feld), gezeichnet in Planpunkten
function handSvg(st, x0, y0, w, h, dd){ return st.map(p => { let q = ''; for (let i = 0; i < p.length; i += 2) q += (x0 + p[i] * w).toFixed(1) + ',' + (y0 + p[i + 1] * h).toFixed(1) + ' ';
  return `<polyline points="${q}" fill="none" stroke="#111" stroke-width="${(h * (dd || .055)).toFixed(2)}" stroke-linecap="round" stroke-linejoin="round"/>`; }).join(''); }
function geo(v, l, txt){
  const F = fGr(v), sw = Math.max(1.5, F * .035);   // dünne Masslinie (Wunsch Mathias 26.11.)
  if (l.art === 'h') {   // Höhenangabe im Grundriss (Wunsch Mathias 26.11.): Kreuz am Messpunkt, «H:» und Kästchen daneben
    const c = F * .35, bw = Math.max(F * 3.6, ((txt || '').length * .58 + 1) * F), x0 = l.x1 + F * .6;
    return {F, sw, segs: [[l.x1 - c, l.y1 - c, l.x1 + c, l.y1 + c, sw * 1.4], [l.x1 - c, l.y1 + c, l.x1 + c, l.y1 - c, sw * 1.4]], a1x: l.x1, a1y: l.y1, a2x: l.x1, a2y: l.y1,
      mx: x0 + F * 1.5 + bw / 2, my: l.y1, wi: 0, bw, bh: F * 1.56, fs: F * 1.05, vor: {t: 'H:', x: x0, y: l.y1}};
  }
  const L = laenge(l) || 1, ux = (l.x2 - l.x1) / L, uy = (l.y2 - l.y1) / L, nx = -uy, ny = ux, ab = l.ab || 0;
  const a1x = l.x1 + nx * ab, a1y = l.y1 + ny * ab, a2x = l.x2 + nx * ab, a2y = l.y2 + ny * ab;
  let sx = nx, sy = ny;                                                              // Seite der Beschriftung: weg vom Bauteil
  if (ab < 0 || (!ab && (ny > 0 || (Math.abs(ny) < 1e-6 && nx > 0)))) { sx = -nx; sy = -ny; }
  const t = F * .4, segs = [];
  if (Math.abs(ab) > F * .3) for (const [x, y] of [[l.x1, l.y1], [l.x2, l.y2]]) { const g = F * .25, u = F * .4, k = ab > 0 ? 1 : -1;
    segs.push([x + nx * g * k, y + ny * g * k, x + nx * (ab + u * k), y + ny * (ab + u * k), sw * .8]); }
  segs.push([a1x - ux * t * .6, a1y - uy * t * .6, a2x + ux * t * .6, a2y + uy * t * .6, sw, 'haupt']);
  for (const [x, y] of [[a1x, a1y], [a2x, a2y]]) segs.push([x + (ux - nx) * t * .7, y + (uy - ny) * t * .7, x - (ux - nx) * t * .7, y - (uy - ny) * t * .7, sw * 1.4]);

  return {F, sw, segs, a1x, a1y, a2x, a2y, mx: (a1x + a2x) / 2 + sx * F * 1.15, my: (a1y + a2y) / 2 + sy * F * 1.15, wi,
    bw: Math.max(F * 3.6, ((txt || '').length * .58 + 1) * F), bh: F * 1.56, fs: F * 1.05};
}
function beschriftung(v, b, l, opt){
  const w = b && b.werte && b.werte[l.id], wert = w && w.v != null ? mmTxt(w.v) : '', so = soll(v, l);
  return opt.modus === 'vorlage' ? (so != null ? '≈ ' + so : '') : (opt.leer ? '' : wert);

function planInhalt(v, b, opt){

    s += `<g class="ml" data-l="${l.id}">${rw && rw.f && opt.modus !== 'druck' ? `<title>${esc((l.text ? l.text + ': ' : '') + rechnungTxt(rw))}</title>` : ''}
      <line x1="${G.a1x}" y1="${G.a1y}" x2="${G.a2x}" y2="${G.a2y}" stroke="transparent" stroke-width="${F * 1.4}"/>
      ${G.segs.map(q => `<line x1="${q[0]}" y1="${q[1]}" x2="${q[2]}" y2="${q[3]}" stroke="${farbe}" stroke-width="${q[5] && sel ? q[4] * 2 : q[4]}"/>`).join('')}
      <g transform="rotate(${wi.toFixed(2)} ${mx} ${my})">${strichStil() ? `<rect x="${bx}" y="${my - G.bh / 2}" width="${bw}" height="${G.bh}" fill="#fff" fill-opacity=".75"/><line x1="${bx}" y1="${my + G.bh / 2}" x2="${bx + bw}" y2="${my + G.bh / 2}" stroke="${akt ? BLAU : farbe}" stroke-width="${akt ? sw * 2.5 : sw * 1.4}"/>` : `<rect x="${bx}" y="${my - G.bh / 2}" width="${bw}" height="${G.bh}" rx="${F * .2}" fill="#fff" fill-opacity=".93" stroke="${akt ? BLAU : farbe}" stroke-width="${akt ? sw * 2.5 : sw}"/>`}
      <text x="${mx}" y="${my + F * .38}" text-anchor="middle" font-size="${G.fs}" font-weight="700" fill="${opt.modus === 'vorlage' ? '#666' : '#111'}" font-family="Arial,sans-serif">${esc(txt)}</text>${!txt && b && opt.modus !== 'vorlage' && !opt.leer && handVon(b, l.id) ? handSvg(handVon(b, l.id), bx, my - G.bh / 2, bw, G.bh, b.hand[l.id].d) : ''}</g>
      ${G.vor ? `<circle cx="${l.x1}" cy="${l.y1}" r="${F * .8}" fill="transparent"/><text x="${G.vor.x}" y="${G.vor.y + F * .38}" font-size="${G.fs}" font-weight="700" fill="${farbe}" font-family="Arial,sans-serif">${G.vor.t}</text>` : ''}
    </g>`;
    if ((opt.modus === 'vorlage' && sel) || opt.griffe === l.id) s += (l.art === 'h' ? [[l.x1, l.y1, 1]] : [[l.x1, l.y1, 1], [l.x2, l.y2, 2]]).map(([x, y, e]) =>
      `<circle class="griff" data-l="${l.id}" data-e="${e}" cx="${x}" cy="${y}" r="${Math.max(F * .55, (opt.gp || 0) * 16)}" fill="#fff" fill-opacity=".6" stroke="${BLAU}" stroke-width="${sw * 1.5}" style="cursor:move"/>`).join('')

  }

    s += `<g class="foto" data-foto="${f.id}" style="cursor:pointer"><rect x="${f.x - z}" y="${f.y - z * .7}" width="${z * 2}" height="${z * 1.4}" rx="${z * .25}" fill="${BLAU}"/>

      <text x="${f.x + z * 1.2}" y="${f.y + F * .38}" font-size="${F}" font-weight="700" fill="${BLAU}" font-family="Arial,sans-serif" paint-order="stroke" stroke="#fff" stroke-width="${F * .2}">F${i + 1}</text></g>`; });

}

// ---------- Zoomen/Verschieben (Mausrad, Ziehen, zwei Finger) ----------
function toPlan(svg, e){ const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
function setzeVb(svg, key){ const vb = S.vb[key]; svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`); }
function einpassen(key, v){ S.vb[key] = {x: 0, y: 0, w: v.w, h: v.h}; }
function zoom(svg, key, f, cx, cy){ const vb = S.vb[key]; vb.x = cx - (cx - vb.x) * f; vb.y = cy - (cy - vb.y) * f; vb.w *= f; vb.h *= f; setzeVb(svg, key); }
function planSteuerung(svg, key, h){   // h: {start(e,p) → true, wenn eine eigene Aktion beginnt; bewege(e,p); ende(e,p); tipp(e,p); stift(e)}
  const ptr = new Map(); let pinch = null, pan = null, eigen = false, bewegt = false, start = null, ziel = null;   // ziel: Element unter dem Finger beim Drücken (pointerup liefert wegen Capture das SVG)

      const [a, c] = [...ptr.values()]; pinch = {d: Math.hypot(a.x - c.x, a.y - c.y), m: {x: (a.x + c.x) / 2, y: (a.y + c.y) / 2}}; return; }
    if (ptr.size > 2) return;
    const p = toPlan(svg, e);
    if (e.button === 0 && !(e.pointerType === 'touch' && h.stift && h.stift()) && h.start && h.start(e, p)) { eigen = true; return; }
    pan = {x: e.clientX, y: e.clientY};

    if (!ptr.has(e.pointerId)) { if (e.pointerType === 'mouse' && h.schweben) h.schweben(e, toPlan(svg, e)); return; } ptr.set(e.pointerId, {x: e.clientX, y: e.clientY});
    if (start && Math.hypot(e.clientX - start.x, e.clientY - start.y) > 6) bewegt = true;
    if (pinch && ptr.size === 2) { const [a, c] = [...ptr.values()], d = Math.hypot(a.x - c.x, a.y - c.y), m = {x: (a.x + c.x) / 2, y: (a.y + c.y) / 2};
      const ctm = svg.getScreenCTM(), vb = S.vb[key];
      vb.x -= (m.x - pinch.m.x) / ctm.a; vb.y -= (m.y - pinch.m.y) / ctm.d;
      const q = toPlan(svg, {clientX: m.x, clientY: m.y}); zoom(svg, key, pinch.d / Math.max(d, 1), q.x, q.y); pinch = {d, m}; return; }
    if (eigen) return h.bewege && h.bewege(e, toPlan(svg, e));
    if (pan) { const ctm = svg.getScreenCTM(), vb = S.vb[key]; vb.x -= (e.clientX - pan.x) / ctm.a; vb.y -= (e.clientY - pan.y) / ctm.d; pan = {x: e.clientX, y: e.clientY}; setzeVb(svg, key); }
  });

    if (!ptr.has(e.pointerId)) return; ptr.delete(e.pointerId);

async function starteImport(datei){
  const I = S.imp = {datei: datei.name, seiten: [], seite: null, rect: null, fertig: {}}; S.ansicht = 'import'; zeichne();
  try {
    if (/pdf$/i.test(datei.type) || /\.pdf$/i.test(datei.name)) {
      if (!window.pdfjsLib) throw new Error('PDF-Leser fehlt');
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'lib/pdf.worker.min.js';
      I.file = datei; S.imp.pdf = await pdfjsLib.getDocument({data: await datei.arrayBuffer()}).promise;
      for (let n = 1; n <= S.imp.pdf.numPages; n++) {
        if (S.ansicht !== 'import' || S.imp !== I) return;
        const page = await S.imp.pdf.getPage(n), vp1 = page.getViewport({scale: 1}), sc = 260 / vp1.width, vp = page.getViewport({scale: sc});
        const c = document.createElement('canvas'); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
        const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
        await page.render({canvasContext: ctx, viewport: vp}).promise;
        const text = (await page.getTextContent()).items.map(i => i.str).join(' ');
        S.imp.seiten.push({n, thumb: c.toDataURL('image/jpeg', .7), ...vorschlag(text, n), wpt: vp1.width, hpt: vp1.height});
        if (I.seite == null) zeichneImport();
      }
    } else {
      const img = await createImageBitmap(datei);
      S.imp.bild = img; S.imp.seiten.push({n: 1, name: datei.name.replace(/\.[^.]+$/, ''), geschosse: '', massstab: '', wpt: img.width, hpt: img.height});
      S.imp.seite = 1; zeichneImport();
    }
  } catch(e) { I.fehler = 'Datei konnte nicht gelesen werden: ' + e.message; if (S.imp === I && S.ansicht === 'import') zeichneImport(); }
}
function vorschlag(text, n){   // Name, Geschosse und Massstab aus dem Plantext (z. B. «Küchen Typ 1», «2. & 3. OG», «Massstab: 1:20»)
  const t = text.replace(/\s+/g, ' ');
  const name = (t.match(/K(?:ü|ue)chen Typ \d+\w?/i) || t.match(/\bTyp \d+\w?/) || [])[0] || 'Seite ' + n;
  let g = '', m = t.match(/(\d+)\.\s*(?:&|und|\+|,|\/)\s*(\d+)\.\s*OG/);
  if (m) g = m[1] + '. OG, ' + m[2] + '. OG'; else if ((m = t.match(/(\d+)\.\s*OG/))) g = m[1] + '. OG'; else if (/\bEG\b/.test(t)) g = 'EG';
  // Massstab: zuerst beim Massstabsbalken («1:20 0.50 1m»), sonst die erste Angabe nach «Massstab»
  const i = t.search(/Massstab/i), ms = (t.match(/\b1\s*:\s*(\d{1,3})\s+0[.,]\d/) || (i >= 0 && t.slice(i).match(/\b1\s*:\s*(\d{1,3})\b/)) || [])[1] || '';
  return {name, geschosse: g, massstab: ms};
}
