<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1C5FD1">

<style>
:root{
  --bg:#E6EAEC; --surface:#FFFFFF; --surface-2:#F1F3F4; --ink:#1A2024; --muted:#5A656C;
  --line:#CBD2D6; --accent:#1C5FD1; --on-accent:#FFFFFF; --warn:#B8323A; --warn-bg:#FBE9EA;
  --ok:#1E7A46; --ok-bg:#E5F3EA; --run:#8A5A00; --run-bg:#FFF3D6; --shadow:0 6px 24px rgba(20,30,40,.10);
  --font:"Barlow Semi Condensed","Arial Narrow",system-ui,-apple-system,"Segoe UI",sans-serif; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13171A; --surface:#1D2226; --surface-2:#252B30; --ink:#E4E8EB; --muted:#97A2A9;
    --line:#343C42; --accent:#6AA2FF; --on-accent:#0A1830; --warn:#FF7378; --warn-bg:#3A1C1F;
    --ok:#6FD39A; --ok-bg:#16301F; --run:#F2C15C; --run-bg:#3A2E12; --shadow:0 6px 24px rgba(0,0,0,.4); color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.4;min-height:100vh;
  padding:max(12px,env(safe-area-inset-top)) 12px max(24px,env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:720px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px;margin:0 0 12px}
.top{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.top h1{flex:1;margin:0;font-size:24px;line-height:1.15}
.top small{display:block;font-size:14px;font-weight:500;color:var(--muted)}
h2{font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);
  border-radius:10px;padding:8px 14px;font-size:16px;font-weight:600;min-height:44px;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.icon{width:44px;padding:0}
.btn:disabled{opacity:.5}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.acts > *{flex:1 1 auto}
label{display:block;font-size:15px;font-weight:600;margin:10px 0 4px}
.field{width:100%;font-size:18px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);min-height:48px}
textarea.field{min-height:72px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-weight:600;padding:0 10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.kacheln{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.kacheln.zwei{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:560px){.kacheln{grid-template-columns:repeat(3,minmax(0,1fr))}.kacheln button{font-size:14px}}
.kacheln button{display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);
  padding:6px 4px 8px;font-weight:600;font-size:15px;cursor:pointer;min-height:44px}
.kacheln button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent);background:var(--surface)}
.kacheln svg{width:100%;max-width:150px;height:auto}
.rechnung{background:var(--surface-2);border-radius:10px;padding:8px 12px;margin-top:8px;font-size:15px}
.rechnung b{font-size:18px}
.messbild{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) minmax(0,1fr);gap:8px;align-items:center;margin-top:10px}
.messbild .oeff{border:4px solid var(--muted);border-bottom:2px dashed var(--muted);border-radius:6px 6px 0 0;padding:6px 8px 14px;display:grid;gap:14px}
.messbild label{font-size:13px;margin:4px 0 2px;white-space:nowrap}
.messbild .mass input{padding-left:6px}
.mbild{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:10px;align-items:center;margin-top:8px}
.mbild svg,svg.sbild{width:100%;height:auto;display:block}
svg.sbild{max-width:420px;margin:8px auto 0}
.mbild label{margin-top:4px}
.mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:13px;font-style:normal;font-weight:700;margin-right:6px;vertical-align:1px}
.pf{stroke:var(--accent);stroke-width:1.6;fill:none}.mkc{fill:var(--accent)}.mkt{fill:var(--on-accent)}
.fortschritt{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 0}
details{border-top:1px solid var(--line);margin-top:12px}
summary{min-height:48px;display:flex;align-items:center;font-weight:600;cursor:pointer}
summary small{font-weight:500;color:var(--muted);margin-left:8px}
.mass{position:relative}
.mass input{text-align:right;font-weight:700;font-size:20px;padding-right:40px}
.mass span{position:absolute;right:12px;bottom:13px;font-size:14px;color:var(--muted)}
.mass.aktiv input{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.hint{font-size:14px;color:var(--muted);margin:6px 0 0}
.chip{display:inline-block;border-radius:8px;padding:3px 8px;font-size:14px;font-weight:700}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.offen{background:var(--run-bg);color:var(--run)}
.tuer{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:12px;margin:0 0 8px;cursor:pointer;min-height:64px}
.tuer .n{flex:1;min-width:0}.tuer b{display:block;font-size:18px}.tuer .s{font-size:14px;color:var(--muted)}
.ergebnis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.ergebnis div{background:var(--surface-2);border-radius:10px;padding:8px}.ergebnis small{display:block;font-size:13px;color:var(--muted)}
.ergebnis b{font-size:22px}
.warnung{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 12px;margin-top:8px;font-weight:600}
.fotos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.fotos img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.leiste{position:sticky;bottom:0;background:var(--bg);padding:10px 0 4px;display:flex;gap:8px}
.leiste > *{flex:1}
.status{font-size:14px;color:var(--muted);margin:8px 0}
svg.skizze{width:100%;max-width:320px;height:auto;display:block;margin:8px auto 0}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:600}
.check input{width:22px;height:22px}
[hidden]{display:none !important}
</style>
</head>
<body>
<main id="app"></main>
<script src="glm.js"></script>
<script>
(function(){
'use strict';
// ---------- Grundlagen ----------
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k, v){ try { localStorage.setItem(k, v); } catch(e){} } };
const jetzt = () => new Date().toISOString();
const mm = v => v == null || v === '' || isNaN(v) ? '–' : String(Math.round(v * 2) / 2).replace('.', ',');
const zahl = s => { const v = parseFloat(String(s).replace(/[\s’']/g, '').replace(',', '.')); return isFinite(v) ? v : null; };
const neueId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const TOL = 5;   // mm: Unterschied oben/unten bzw. links/rechts ab dem gewarnt wird

const TYPEN = ['Blockrahmen', 'Futter', 'Stahlzarge', 'Rahmentüre', 'Blendrahmen'];
const insTyp = typ => typ === 'Rahmentüre' || typ === 'Blendrahmen';   // Rahmen steht ins Licht (Rahmentüre: in der Leibung, Blendrahmen: vor der Wand)
const EINSCHLAG = ['stumpf', 'mit Überschlag'];
const ANSCHLAG = ['DIN links', 'DIN rechts'];
const ANFORD = ['EI30', 'EI60', 'Rauchschutz', 'Schallschutz', 'Nassraum'];
const RC = ['RC2', 'RC3'];   // Einbruchschutz-Klasse (eine wählbar)
// Messfelder in der Reihenfolge, in der der Bosch-Wert weiterspringt
const MASSE = [
  {k:'b_o', t:'Breite oben', g:'b'}, {k:'b_m', t:'Breite Mitte', g:'b'}, {k:'b_u', t:'Breite unten', g:'b'},
  {k:'h_l', t:'Höhe links', g:'h'}, {k:'h_r', t:'Höhe rechts', g:'h'},
  {k:'w_o', t:'Wand oben', g:'w'}, {k:'w_m', t:'Wand Mitte', g:'w'}, {k:'w_u', t:'Wand unten', g:'w'},
  {k:'d_b', t:'Durchgang Breite', g:'opt'}, {k:'d_h', t:'Durchgang Höhe', g:'opt'}, 
  {k:'rb_l', t:'Rahmendicke links', g:'rb'}, {k:'rb_r', t:'Rahmendicke rechts', g:'rb'},
];

const token = () => ls.get('upload-schluessel'), repo = () => ls.get('planung-repo');
const BETA = ls.get('beta') === '1';
const Q = new URLSearchParams(location.search);
let S = {ansicht: 'liste', nr: null, tuerId: null, aktivFeld: null, sync: '', offen: {}, fokus: null};
let index = ladeLokal('tueren-index') || {v:1, auftraege: []};
let daten = null;   // aktueller Auftrag {v, auftrag:{nr,titel,kunde,objekt,adresse}, tueren:[]}

function ladeLokal(k){ try { return JSON.parse(ls.get(k) || 'null'); } catch(e){ return null; } }

// ---------- GitHub (privates Repo, Branch «kontrolle», Ordner tueren/) ----------
const API = 'https://api.github.com', BRANCH = 'kontrolle';
async function gh(method, pfad, body){
  const r = await fetch(API + pfad, {method, headers: Object.assign({'Authorization': 'Bearer ' + token(), 'Accept': 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28'}, body ? {'Content-Type': 'application/json'} : {}), body: body ? JSON.stringify(body) : undefined});
  if (r.status === 404) return null;
  if (!r.ok) { const e = new Error('GitHub ' + r.status); e.status = r.status; throw e; }
  return r.status === 204 ? {} : r.json();
}
const b64enc = s => btoa(unescape(encodeURIComponent(s))), b64dec = s => decodeURIComponent(escape(atob(s.replace(/\s/g, ''))));
const pfad = p => '/repos/' + repo() + '/contents/' + p.split('/').map(encodeURIComponent).join('/');
async function branchSicher(){
  if (await gh('GET', '/repos/' + repo() + '/git/ref/heads/' + BRANCH)) return;
  const main = await gh('GET', '/repos/' + repo() + '/git/ref/heads/main');
  await gh('POST', '/repos/' + repo() + '/git/refs', {ref: 'refs/heads/' + BRANCH, sha: main.object.sha});
}
async function holeJson(p){ const f = await gh('GET', pfad(p) + '?ref=' + BRANCH); return f ? {sha: f.sha, d: JSON.parse(b64dec(f.content))} : {sha: null, d: null}; }
async function schreibe(p, inhaltB64, sha, msg){ return gh('PUT', pfad(p), {message: msg, content: inhaltB64, branch: BRANCH, ...(sha ? {sha} : {})}); }
const online = () => !!(token() && repo() && navigator.onLine);

// Zusammenführen: je Tür bzw. Auftrag gewinnt der neuere Zeitstempel
function mischeIndex(a, b){
  const m = {}; for (const q of [a, b]) for (const x of (q && q.auftraege) || []) if (!m[x.nr] || (x.zeit || '') > (m[x.nr].zeit || '')) m[x.nr] = x;
  return {v: 1, auftraege: Object.values(m).sort((x, y) => String(y.zeit).localeCompare(String(x.zeit)))};
}
function mischeDaten(a, b){
  if (!a) return b; if (!b) return a;
  const t = {}; for (const q of [a, b]) for (const x of q.tueren || []) if (!t[x.id] || (x.zeit || '') > (t[x.id].zeit || '')) t[x.id] = x;
  const auftrag = (a.auftrag && b.auftrag) ? ((a.auftrag.zeit || '') > (b.auftrag.zeit || '') ? a.auftrag : b.auftrag) : (a.auftrag || b.auftrag);
  return {v: 1, auftrag, tueren: Object.values(t).sort((x, y) => (x.erstellt || '').localeCompare(y.erstellt || ''))};
}
let syncT = 0, laeuft = false;
function speichern(){
  if (daten) ls.set('tueren-' + daten.auftrag.nr, JSON.stringify(daten));
  ls.set('tueren-index', JSON.stringify(index));
  clearTimeout(syncT); syncT = setTimeout(hochladen, 2000);
}
async function hochladen(versuch){
  if (!token() || !repo()) { S.sync = 'Nur auf diesem Gerät gespeichert (kein Upload-Schlüssel).'; return zeigeSync(); }
  if (!navigator.onLine) { S.sync = 'Offline – auf dem Gerät gespeichert, wird später hochgeladen.'; return zeigeSync(); }
  if (laeuft) { clearTimeout(syncT); syncT = setTimeout(hochladen, 1500); return; }
  laeuft = true; S.sync = 'Speichere …'; zeigeSync();
  try {
    await branchSicher();
    await fotosHochladen();
    const fi = await holeJson('tueren/index.json'); index = mischeIndex(fi.d, index); ls.set('tueren-index', JSON.stringify(index));
    await schreibe('tueren/index.json', b64enc(JSON.stringify(index, null, 1)), fi.sha, 'Türaufmass: Auftragsliste');
    if (daten) {
      const p = 'tueren/' + daten.auftrag.nr + '.json', f = await holeJson(p);
      daten = mischeDaten(f.d, daten); ls.set('tueren-' + daten.auftrag.nr, JSON.stringify(daten));
      await schreibe(p, b64enc(JSON.stringify(daten, null, 1)), f.sha, 'Türaufmass ' + daten.auftrag.nr);
    }
    S.sync = 'Gespeichert für die Planung · ' + new Date().toLocaleTimeString('de-CH', {hour: '2-digit', minute: '2-digit'});
  } catch(e) {
    laeuft = false;
    if ((e.status === 409 || e.status === 422) && !versuch) return hochladen(1);
    S.sync = e.status === 401 ? 'Upload-Schlüssel ungültig – in der Übersicht neu einfügen. Auf dem Gerät gespeichert.'
           : 'Hochladen fehlgeschlagen (' + (e.status || e.message) + '). Auf dem Gerät gespeichert.';
  }
  laeuft = false; zeigeSync();
}
addEventListener('online', () => hochladen());
function zeigeSync(){ const el = $('#sync'); if (el) el.textContent = S.sync; }

// ---------- Fotos: verkleinern, im Gerät zwischenspeichern (IndexedDB), dann ins Repo ----------
let idb = null;
function db(){ return idb || (idb = new Promise((ok, err) => { const r = indexedDB.open('tueraufmass', 1); r.onupgradeneeded = () => r.result.createObjectStore('fotos');
  r.onsuccess = () => ok(r.result); r.onerror = () => err(r.error); })); }
async function idbTx(mode, fn){ const d = await db(); return new Promise((ok, err) => { const t = d.transaction('fotos', mode); const r = fn(t.objectStore('fotos')); t.oncomplete = () => ok(r && r.result); t.onerror = () => err(t.error); }); }
const fotoSetzen = (k, v) => idbTx('readwrite', s => s.put(v, k)), fotoHolen = k => idbTx('readonly', s => s.get(k)),
      fotoLoeschen = k => idbTx('readwrite', s => s.delete(k)), fotoSchluessel = () => idbTx('readonly', s => s.getAllKeys());
async function verkleinern(file){
  const img = await createImageBitmap(file); const f = Math.min(1, 1600 / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * f); c.height = Math.round(img.height * f);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return new Promise(ok => c.toBlob(ok, 'image/jpeg', 0.72));
}
const blobB64 = b => new Promise(ok => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.readAsDataURL(b); });
async function fotosHochladen(){
  for (const k of (await fotoSchluessel().catch(() => [])) || []) {
    const blob = await fotoHolen(k); if (!blob) continue;
    const vorhanden = await gh('GET', pfad(k) + '?ref=' + BRANCH);
    if (!vorhanden) await schreibe(k, await blobB64(blob), null, 'Türaufmass Foto');
    await fotoLoeschen(k);
  }
}
const fotoUrls = {};
async function fotoUrl(k){
  if (fotoUrls[k]) return fotoUrls[k];
  let blob = await fotoHolen(k).catch(() => null);
  if (!blob && online()) {
    const r = await fetch(API + pfad(k) + '?ref=' + BRANCH, {headers: {'Authorization': 'Bearer ' + token(), 'Accept': 'application/vnd.github.raw'}});
    if (r.ok) blob = await r.blob();
  }
  return blob ? (fotoUrls[k] = URL.createObjectURL(blob)) : '';
}

// ---------- Rechnen und prüfen ----------
const werte = (t, g) => MASSE.filter(m => m.g === g).map(m => t.masse[m.k]).filter(v => v != null && v !== '');
function auswerten(t){
  const B = werte(t, 'b'), Hm = werte(t, 'h'), W = werte(t, 'w');
  const bezug = t.bezug || 'Fertigboden', mr = +t.meterriss || 1000, ba = t.keinBoden ? (+t.bodenaufbau || +t.boden_i || 0) : 0;   // ohne eigenen Wert gilt der Bodenaufbau innen
  // Höhe ab Fertigboden: ab Meterriss gemessen → + Meterriss; ab Rohboden (kein Fertigboden) → − Bodenaufbau
  const zuFB = h => bezug === 'Meterriss' ? h + mr : h - ba;
  const H = Hm.map(zuFB);
  const r = {B: B.length ? Math.min(...B) : null, H: H.length ? Math.min(...H) : null, W: W.length ? Math.max(...W) : null, hinweise: [], fehlt: []};
  const spanne = a => a.length > 1 ? Math.max(...a) - Math.min(...a) : 0;
  if (spanne(B) > TOL) r.hinweise.push(`Breite oben/unten ${mm(spanne(B))} mm verschieden – nicht im Lot`);
  if (spanne(H) > TOL) r.hinweise.push(`Höhe links/rechts ${mm(spanne(H))} mm verschieden – Sturz/Boden schief`);
  if (spanne(W) > TOL) r.hinweise.push(`Wandstärke ${mm(spanne(W))} mm verschieden – Leibung schief`);
  // Rahmen: Rahmentüre geht «ins Licht» (pro Seite) → Rahmenlicht = Licht − 2 × x, aussen = + Rahmendicken.
  // Übrige Typen stehen mit Luft in der Öffnung → Rahmen aussen = Licht − Luft (gesamt), Rahmenlicht = − Rahmendicken.
  const M = t.masse, gesetzt = v => v != null && v !== '' && !isNaN(v);
  const rl = gesetzt(M.rb_l) ? +M.rb_l : (gesetzt(M.rb) ? +M.rb : null), rr = gesetzt(M.rb_r) ? +M.rb_r : (gesetzt(M.rb) ? +M.rb : null);
  r.rbl = rl; r.rbr = rr; r.RA = r.RL = r.RAH = r.RLH = null; r.rechnung = '';
  if (r.B != null && insTyp(t.typ) && gesetzt(t.insLicht)) {
    r.RL = r.B - 2 * t.insLicht; r.rechnung = `Rahmenlicht = ${mm(r.B)} − 2 × ${mm(t.insLicht)} = ${mm(r.RL)}`;
    if (rl != null && rr != null) { r.RA = r.RL + rl + rr; r.rechnung += ` · Rahmen aussen = ${mm(r.RL)} + ${mm(rl)} + ${mm(rr)} = ${mm(r.RA)}`; }
    if (r.RL <= 0) r.hinweise.push('Rahmen ins Licht: Mass prüfen');
  } else if (r.B != null && t.typ && !insTyp(t.typ) && gesetzt(t.luft)) {
    r.RA = r.B - t.luft; r.rechnung = `Rahmen aussen = ${mm(r.B)} − ${mm(t.luft)} = ${mm(r.RA)} (je Seite ${mm(t.luft / 2)} Luft)`;
    if (rl != null && rr != null) { r.RL = r.RA - rl - rr; r.rechnung += ` · Rahmenlicht = ${mm(r.RA)} − ${mm(rl)} − ${mm(rr)} = ${mm(r.RL)}`; }
    if (t.luft < 0 || t.luft > 60) r.hinweise.push('Luft seitlich: Mass prüfen');
  }
  // Höhe: Luft oben + unten (gesamt) bzw. Rahmen ins Licht nur oben
  const tr = x => r.rechnung += (r.rechnung ? ' · ' : '') + x;
  if (r.H != null && insTyp(t.typ) && gesetzt(t.insLicht)) { r.RLH = r.H - t.insLicht; tr(`Rahmenlicht Höhe = ${mm(r.H)} − ${mm(t.insLicht)} = ${mm(r.RLH)}`); }
  else if (r.H != null && t.typ && !insTyp(t.typ) && gesetzt(t.luftH)) {
    r.RAH = r.H - t.luftH; tr(`Rahmen aussen Höhe = ${mm(r.H)} − ${mm(t.luftH)} = ${mm(r.RAH)} (oben und unten je ${mm(t.luftH / 2)} Luft)`);

      ${t.typ ? `<h2>Rahmen <span style="text-transform:none;letter-spacing:0">(${esc(t.typ)})</span></h2><div class="mbild">${bildRahmen(t)}<div>
        ${insTyp(t.typ) ? zusatz('insLicht', 'ins Licht pro Seite', t, 'a') + massFeld(F('rb_l'), t, 'Rahmendicke links', 'b') + massFeld(F('rb_r'), t, 'Rahmendicke rechts', 'c')

        ${r.rechnung ? `<div class="rechnung">${r.rechnung.split(' · ').map(x => { const i = x.lastIndexOf('= '); return esc(x.slice(0, i + 2)) + '<b>' + esc(x.slice(i + 2)) + '</b>'; }).join('<br>')}</div>` : ''}`

      <h2>Schwelle und Boden</h2>${bildSchwelle()}
      <div class="grid3">${zusatz('boden_i', 'Boden innen', t, 'a')}${zusatz('schwelle', 'Schwelle', t, 'b')}${zusatz('boden_a', 'Boden aussen', t, 'c')}</div>
      <p class="hint">a/c: Bodenaufbau ab Rohboden bis Fertigboden, innen und aussen. b: Schwellenhöhe über Fertigboden innen. Keine Schwelle = 0.</p>

      ${r.hinweise.map(h => `<div class="warnung">${esc(h)}</div>`).join('')}

      <details data-auf="opt" ${auf('opt', t.masse.d_b || t.masse.d_h)}><summary>Durchgangsmass <small>optional</small></summary><div class="mbild">${bildDurchgang()}<div>${massFeld(F('d_b'), t, 'Breite', 'a')}${massFeld(F('d_h'), t, 'Höhe', 'b')}</div></div></details>
      <details data-auf="skizze" ${auf('skizze', false)}><summary>Skizze</summary>
      ${skizze(t)}</details>
    </div>
    <div class="card"><h2 style="margin-top:0">Anforderungen</h2>${seg('anf', ANFORD, t.anf, true)}
      <label>Einbruchschutz (RC)</label>${seg('rc', RC, t.rc)}

      <div class="grid2"><div><label for="tSchloss">Schloss</label><input class="field" id="tSchloss" data-f="schloss" value="${esc(t.schloss)}" placeholder="PZ / BB / WC"></div>
      <div><label for="tBaender">Bänder</label><input class="field" id="tBaender" data-f="baender" value="${esc(t.baender)}"></div></div>
      <label for="tDr">Drücker</label><input class="field" id="tDr" data-f="druecker" value="${esc(t.druecker)}">
      <label class="check"><input type="checkbox" data-f="schliesser" ${t.schliesser ? 'checked' : ''}> Türschliesser</label>
      <label class="check"><input type="checkbox" data-f="bodendichtung" ${t.bodendichtung ? 'checked' : ''}> Bodendichtung</label>
      <label for="tNotiz">Notiz</label><textarea class="field" id="tNotiz" data-f="notiz">${esc(t.notiz)}</textarea></details>
      <h2>Fotos</h2><div class="fotos" id="fotos"></div>
      <div class="acts"><label class="btn" style="margin:0">Foto aufnehmen<input type="file" accept="image/*" capture="environment" id="foto" hidden></label></div>
    </div>
    <div class="leiste"><button class="btn" type="button" id="loeschen">Tür löschen</button><button class="btn primary" type="button" id="weiter">Fertig · nächste Tür</button></div>
    <p class="status" id="sync">${esc(S.sync)}</p>`;
  $('#zurueck').onclick = () => { S.ansicht = 'auftrag'; zeichne(); };
  $('#weiter').onclick = neueTuer;
  $('#loeschen').onclick = () => { if (confirm('Tür ' + (t.nr || '') + ' löschen?')) { aendern(t, {geloescht: true}); S.ansicht = 'auftrag'; zeichne(); } };
  $('#glm').onclick = () => GLM.verbinden();
  $('#app').querySelectorAll('[data-seg]').forEach(g => g.onclick = ev => {
    const b = ev.target.closest('button'); if (!b) return; const f = g.dataset.seg, v = b.dataset.v;
    if (f === 'anf') { const a = new Set(t.anf || []); a.has(v) ? a.delete(v) : a.add(v); aendern(t, {anf: [...a]}); }

  $('#app').querySelectorAll('details[data-auf]').forEach(d => d.ontoggle = () => { S.offen[d.dataset.auf] = d.open; });

    i.onfocus = () => { S.aktivFeld = i.dataset.mass; $('#app').querySelectorAll('.mass.aktiv').forEach(x => x.classList.remove('aktiv')); i.parentNode.classList.add('aktiv'); };
    i.onkeydown = ev => { if (ev.key !== 'Enter') return; ev.preventDefault();
      const n = MASSE[MASSE.findIndex(m => m.k === i.dataset.mass) + 1], haupt = m => m && 'bhw'.includes(m.g);

  });

      const v = i.type === 'checkbox' ? i.checked : (['meterriss', 'bodenaufbau', 'luft', 'luftH', 'insLicht', 'boden_i', 'schwelle', 'boden_a'].includes(f) ? (i.value.trim() === '' ? '' : zahl(i.value)) : i.value);
      aendern(t, {[f]: v}); if (['keinBoden', 'meterriss', 'bodenaufbau', 'nr', 'luft', 'luftH', 'insLicht', 'boden_i', 'schwelle', 'boden_a'].includes(f)) zeichneMitFokus(); });
  });
  $('#foto').onchange = async ev => { const f = ev.target.files[0]; if (!f) return;
    const blob = await verkleinern(f), k = `tueren/${daten.auftrag.nr}/${t.id}-${(t.fotos || []).length + 1}-${Date.now().toString(36)}.jpg`;
    await fotoSetzen(k, blob); aendern(t, {fotos: (t.fotos || []).concat(k)}); zeigeFotos(t); };

}
async function zeigeFotos(t){

  el.innerHTML = (t.fotos || []).length ? '' : '<p class="hint">Noch keine Fotos.</p>';

function naechstes(i){ const a = [...$('#app').querySelectorAll('.mass input')].filter(x => x.offsetParent && !x.closest('details:not([open])')); return a[a.indexOf(i) + 1] || null; }

  const el = id && document.getElementById(id); if (el) { const d = el.closest('details'); if (d) d.open = true; el.focus({preventScroll: !sprung}); if (sprung && el.select) el.select(); } }

// Bosch-Messwert → aktives Feld, danach nächstes leeres Pflichtfeld
GLM.beiStatus = () => { const b = $('#glm'); if (b) { b.textContent = GLM.text(); b.classList.toggle('primary', GLM.status === 'ok'); } };
GLM.beiWert = v => {
  const t = S.ansicht === 'tuer' && aktuelleTuer(); if (!t) return;
  const k = S.aktivFeld || (MASSE.find(m => m.g !== 'opt' && (t.masse[m.k] == null || t.masse[m.k] === '')) || {}).k; if (!k) return;
  aendern(t, {masse: Object.assign({}, t.masse, {[k]: v})});
  const i = MASSE.findIndex(m => m.k === k), naechst = MASSE.slice(i + 1).find(m => t.masse[m.k] == null || t.masse[m.k] === '');
  S.aktivFeld = naechst ? naechst.k : null; if (navigator.vibrate) navigator.vibrate(60);
  const y = scrollY; zeichne(); scrollTo(0, y);
};

// ---------- Ausgaben für den Türhersteller ----------
const SPALTEN = ['Tür', 'Raum', 'Typ', 'Einschlag', 'Anschlag', 'Lichtmass Breite', 'Höhe ab FB', 'Wandstärke max', 'Breite o/m/u', 'Höhe l/r gemessen',
  'Höhenbezug', 'Bodenaufbau', 'Schwellenhöhe', 'Bodenaufbau innen', 'Bodenaufbau aussen', 'Wand o/m/u', 'Durchgang B', 'Durchgang H', 'Luft seitlich gesamt', 'Luft Höhe gesamt', 'Rahmen ins Licht pro Seite',
  'Rahmendicke l/r', 'Rahmen aussen B', 'Rahmen aussen H', 'Rahmenlicht B', 'Rahmenlicht H', 'Anforderungen', 'Schloss', 'Bänder', 'Drücker',
  'Türschliesser', 'Bodendichtung', 'Hinweise', 'Notiz'];
const leer = v => v == null || v === '' || isNaN(v) ? '' : mm(v);
function zeile(t){
  const r = auswerten(t), M = t.masse, j = ks => ks.map(k => mm(M[k])).join(' / ');
  return [t.nr, t.raum, t.typ, t.einschlag, t.anschlag, mm(r.B), mm(r.H), mm(r.W), j(['b_o', 'b_m', 'b_u']), j(['h_l', 'h_r']),
    t.bezug === 'Meterriss' ? `Meterriss (${mm(t.meterriss || 1000)})` : 'Fertigboden', t.keinBoden ? leer(t.bodenaufbau === '' || t.bodenaufbau == null ? t.boden_i : t.bodenaufbau) : '', leer(t.schwelle), leer(t.boden_i), leer(t.boden_a), j(['w_o', 'w_m', 'w_u']),
    leer(M.d_b), leer(M.d_h), t.typ && !insTyp(t.typ) ? leer(t.luft) : '', t.typ && !insTyp(t.typ) ? leer(t.luftH) : '', insTyp(t.typ) ? leer(t.insLicht) : '',
    r.rbl != null || r.rbr != null ? mm(r.rbl) + ' / ' + mm(r.rbr) : '', leer(r.RA), leer(r.RAH), leer(r.RL), leer(r.RLH), (t.anf || []).concat(t.rc ? [t.rc] : []).join(', '), t.schloss, t.baender, t.druecker,
    t.schliesser ? 'ja' : '', t.bodendichtung ? 'ja' : '', r.hinweise.concat(r.fehlt.length ? ['fehlt: ' + r.fehlt.join(', ')] : []).join('; '), t.notiz];
}
const aktiveTueren = () => daten.tueren.filter(t => !t.geloescht);
function csv(){
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const text = '﻿' + [SPALTEN].concat(aktiveTueren().map(zeile)).map(z => z.map(q).join(';')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type: 'text/csv;charset=utf-8'}));

}
function drucken(){

    border-top:1px solid #bbb;padding:12px 0;page-break-inside:avoid}h2{margin:0 0 4px;font-size:16px}p{margin:2px 0}table{border-collapse:collapse;margin-top:6px}
    th,td{text-align:left;padding:2px 10px 2px 0;vertical-align:top}th{font-weight:600;color:#555}svg{width:200px;height:auto}</style>
